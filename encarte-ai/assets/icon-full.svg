<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Encarte Aí — app icon (vector recreation, iOS-style rounded square)</title>
  <rect width="1024" height="1024" rx="228" ry="228" fill="#102018"/>
  <defs>
    <clipPath id="f-tagclip"><path d="M358.07,128.5 L664.93,128.5 A6,6 0 0 1 669.7,130.87 L764.87,255.85 A8,8 0 0 1 766.5,260.7 L766.5,851.75 A44,44 0 0 1 722.5,895.75 L300.5,895.75 A44,44 0 0 1 256.5,851.75 L256.5,260.7 A8,8 0 0 1 258.13,255.85 L353.3,130.87 A6,6 0 0 1 358.07,128.5 Z"/></clipPath>
    <clipPath id="f-cardclip"><rect x="311" y="311" width="401.5" height="401.5" rx="10"/></clipPath>
    <mask id="f-hole" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="511.75" cy="218.5" r="35.0" fill="#000"/>
    </mask>
    <filter id="f-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <g id="symbol">
    <!-- hole fill: same dark green as the icon background (the in-app logo also shows a dark hole). Delete this circle for a see-through hole. -->
    <circle id="hole-fill" cx="511.75" cy="218.5" r="36.0" fill="#102018"/>
    <g mask="url(#f-hole)">
      <g clip-path="url(#f-tagclip)">
        <rect x="200" y="100" width="624" height="840" fill="#3CAD4C"/>
        <!-- 45-degree fold / long shadow -->
        <path d="M800,227 L700,327 L700,700 L454,700 L230,924 L800,924 Z" fill="#2F8A3B"/>
        <!-- card drop shadow (down-right) -->
        <rect x="322" y="322" width="401.5" height="401.5" rx="10" fill="#000" fill-opacity="0.19" filter="url(#f-soft)"/>
      </g>
      <!-- hang ring -->
      <circle cx="511.75" cy="218.5" r="44.65" fill="none" stroke="#FFFFFF" stroke-width="19.299999999999997"/>
    </g>
    <!-- string -->
    <path d="M503,128.5 L520.5,128.5 L520.5,198.75 A8.75,8.75 0 0 1 503,198.75 Z" fill="#FFFFFF"/>
    <!-- white card with orange corner -->
    <rect x="311" y="311" width="401.5" height="401.5" rx="10" fill="#FFFFFF"/>
    <path d="M564,713 L713,713 L713,564 Z" fill="#F6A623" clip-path="url(#f-cardclip)"/>
    <!-- 4-point sparkle -->
    <path d="M512,398 C522,476 548,502 626,512 C548,522 522,548 512,626 C502,548 476,522 398,512 C476,502 502,476 512,398 Z" fill="#3CAD4C"/>
  </g>
</svg>
