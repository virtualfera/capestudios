<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cape · Localização</title>
<link rel="stylesheet" href="../base.css">
<style>
/* ===== Formato LOCALIZAÇÃO =====
   Gancho -> pin cai no lugar (sobre o take de drone/fachada) -> o que te espera lá (só fatos reais) -> cartão final com endereço e CTA.
   Funciona por cima de vídeo (fundo transparente) ou com foto (Ken Burns) ou só com a marca. */
#stage { background: var(--fundo); }
.fundo { position: absolute; inset: 0; overflow: hidden; }
.fundo img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 45%; will-change: transform; }
.fundo .grade { position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,.0) 32%, rgba(0,0,0,0) 52%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.75) 100%); }
.fundo.marca { background: radial-gradient(120% 80% at 50% 38%, color-mix(in srgb, var(--fundo) 88%, #fff) 0%, var(--fundo) 55%, color-mix(in srgb, var(--fundo) 82%, #000) 100%); }
.fundo.marca .logo-gigante { position: absolute; width: 1700px; height: 1700px; left: -310px; top: 980px; border-radius: 50%; opacity: .06; object-fit: cover; }
.grao { position: absolute; inset: -50%; width: 200%; height: 200%; opacity: .07; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }

/* gancho */
.gancho { position: absolute; left: 80px; top: 250px; width: 900px; z-index: 30; }
.gancho .linha { display: block; }
.gancho .pal { display: inline-block; will-change: transform, opacity; }
body[data-cliente="arteiro"] .gancho { font: 400 118px/1.02 var(--f-titulo); text-transform: uppercase; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.45); }
body[data-cliente="arteiro"] .gancho .acento { line-height: 1.12; display: inline-block; text-shadow: none; }
body[data-estilo="gradiente"] .gancho { font: 800 88px/1.08 var(--f-titulo); color: var(--txt); }
body[data-estilo="italico-serifa"] .gancho { font: 700 86px/1.1 var(--f-texto); color: var(--txt); letter-spacing: -2px; }
body[data-estilo="italico-serifa"] .gancho .acento { font-size: 1.12em; }
body[data-estilo="caixa-laranja"] .gancho { font: 800 92px/1.1 var(--f-titulo); color: #fff; text-transform: uppercase; }
body[data-estilo="caixa-laranja"] .gancho .acento { display: inline-block; line-height: 1.16; }
.sobre-foto .gancho { color: #fff !important; text-shadow: 0 6px 30px rgba(0,0,0,.5); }

/* pin */
.pin { position: absolute; width: 190px; height: 250px; margin-left: -95px; margin-top: -250px; z-index: 40; transform-origin: 50% 100%; will-change: transform; }
.pin svg.gota { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 18px 24px rgba(0,0,0,.45)); }
.pin .cabeca { position: absolute; left: 25px; top: 22px; width: 140px; height: 140px; border-radius: 50%; overflow: hidden; background: #fff; }
.pin .cabeca img { width: 100%; height: 100%; object-fit: cover; }
.sombra { position: absolute; width: 120px; height: 30px; margin-left: -60px; margin-top: -15px; border-radius: 50%; background: radial-gradient(rgba(0,0,0,.55), rgba(0,0,0,0) 70%); z-index: 35; }
.onda { position: absolute; border-radius: 50%; border: 7px solid var(--pri); z-index: 34; transform: translate(-50%, -50%) scaleY(.42); }

/* rótulo do pin */
.rotulo { position: absolute; z-index: 41; display: flex; flex-direction: column; overflow: hidden; border-radius: 26px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
.rotulo .nm { padding: 26px 34px 6px; white-space: nowrap; }
.rotulo .bx { padding: 0 34px 26px; white-space: nowrap; font: 600 36px/1.2 var(--f-texto); display: flex; align-items: center; gap: 12px; }
body[data-cliente="arteiro"] .rotulo { background: #fff; color: #111; }
body[data-cliente="arteiro"] .rotulo .nm { font: 400 76px/1 var(--f-titulo); text-transform: uppercase; }
body[data-estilo="gradiente"] .rotulo { background: #fff; color: var(--txt); }
body[data-estilo="gradiente"] .rotulo .nm { font: 800 50px/1.05 var(--f-titulo); color: var(--pri); }
body[data-estilo="italico-serifa"] .rotulo { background: #fff; color: var(--txt); }
body[data-estilo="italico-serifa"] .rotulo .nm { font: 700 italic 64px/1 var(--f-acento); color: var(--pri); }
body[data-estilo="caixa-laranja"] .rotulo { background: var(--pri); color: #fff; }
body[data-estilo="caixa-laranja"] .rotulo .nm { font: 800 54px/1 var(--f-titulo); text-transform: uppercase; }
.rotulo .bx .ico { width: 34px; height: 34px; color: var(--pri); }
body[data-estilo="caixa-laranja"] .rotulo .bx .ico { color: #fff; }

/* o que te espera */
.fatos { position: absolute; left: 80px; top: 1060px; width: 860px; z-index: 45; }
.fatos .tit { font: 700 34px/1 var(--f-texto); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 22px; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.5); }
.fatos .chip { display: flex; align-items: center; gap: 24px; width: max-content; max-width: 860px; padding: 18px 34px 18px 18px; margin-bottom: 18px;
  border-radius: 999px; font: 700 44px/1.1 var(--f-texto); will-change: transform, opacity; box-shadow: 0 14px 34px rgba(0,0,0,.25); }
.fatos .chip .bola { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.fatos .chip .bola .ico { width: 44px; height: 44px; }
body[data-cliente="arteiro"] .fatos .chip { background: rgba(255,255,255,.96); color: #111; }
body[data-cliente="arteiro"] .fatos .chip .bola { color: #fff; }
body[data-estilo="gradiente"] .fatos .chip { background: #fff; color: var(--txt); }
body[data-estilo="gradiente"] .fatos .chip .bola { background: var(--pri); color: #fff; }
body[data-estilo="italico-serifa"] .fatos .chip { background: #fff; color: var(--txt); }
body[data-estilo="italico-serifa"] .fatos .chip .bola { background: var(--dest); color: var(--pri); }
body[data-estilo="caixa-laranja"] .fatos .chip { background: #fff; color: #14203a; }
body[data-estilo="caixa-laranja"] .fatos .chip .bola { background: var(--pri); color: #fff; }
.claro .fatos .tit { color: var(--pri); text-shadow: none; }

/* cartão final */
.final { position: absolute; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 90px 160px; box-sizing: border-box; }
.final .veu { position: absolute; inset: 0; background: var(--fundo); }
.final > *:not(.veu) { position: relative; }
.final .selo { position: relative; width: 330px; height: 330px; margin-bottom: 54px; }
.final .selo img { position: absolute; left: 35px; top: 35px; width: 260px; height: 260px; border-radius: 50%; object-fit: cover; }
.final .selo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.final .nm { text-wrap: balance; font: 800 74px/1.05 var(--f-titulo); color: var(--txt); }
body[data-cliente="arteiro"] .final .nm { text-wrap: balance; font: 400 120px/1 var(--f-titulo); text-transform: uppercase; color: #fff; }
body[data-estilo="italico-serifa"] .final .nm { text-wrap: balance; font: 700 italic 92px/1 var(--f-acento); color: var(--pri); }
body[data-estilo="gradiente"] .final .nm { color: var(--pri); font-size: 64px; }
.final .end { margin-top: 26px; font: 600 42px/1.3 var(--f-texto); color: var(--txt); opacity: .9; display: flex; align-items: center; gap: 14px; justify-content: center; }
.final .end .ico { width: 42px; height: 42px; color: var(--pri); }
body[data-cliente="arteiro"] .final .end .ico { color: var(--dest); }
.final .cid { font: 500 34px/1.3 var(--f-texto); color: var(--txt); opacity: .7; margin-top: 6px; }
.final .cta { text-wrap: balance; margin-top: 64px; padding: 30px 48px; border-radius: 999px; font: 800 42px/1.15 var(--f-texto); background: var(--pri); color: #fff; max-width: 860px; }
body[data-cliente="arteiro"] .final .cta { background: var(--dest); color: #111; }
.final .arroba { margin-top: 30px; font: 600 34px/1 var(--f-texto); color: var(--txt); opacity: .65; }
</style>
<script src="../runtime.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
window.SPEC_EXEMPLO = {
  marca: { slug: 'arteiro', nome: 'Arteiro', cores: { fundo: '#0b0b0d', primaria: '#fff', secundaria: '#151518', destaque: '#f5c400', texto: '#fff', texto_sobre_destaque: '#111', anel: ['#e2332b','#f08a24','#f5c400','#5fb547','#1aa6a0','#2f6fd0','#7a4bc2','#e0569b'] },
    fontes: { titulo: 'AntonL', texto: 'Inter', acento: 'AntonL' }, estilo_acento: 'caixa-destaque', local: { nome_curto: 'Arteiro', bairro: 'Itaipava', cidade: 'Petrópolis · RJ' }, fatos: [], cta_padrao: 'Salva esse vídeo' },
  dados: { gancho: 'Sabe esse prédio\nde *containers*?' }, base_dir: ''
};

window.CENA = (() => {
  let S, D, M, dur, T, refs = {}, legendas = () => {};

  function anel(cores, raio, esp) {
    // anel de listras concêntricas na paleta do cliente (ecoa o logo do Arteiro); para os outros, 1 cor
    const n = cores.length, passo = esp / n;
    return cores.map((c, i) => `<circle cx="165" cy="165" r="${raio - i * passo}" fill="none" stroke="${c}" stroke-width="${passo + .6}"/>`).join('');
  }

  return {
    get dur() { return dur; },
    async montar(spec) {
      S = spec; M = spec.marca; D = spec.dados || {};
      dur = D.dur || 15;
      const k = dur / 15;
      T = Object.assign({ gancho: [0.15, 3.0], pin: 3.15, rotulo: 3.85, fatos: [6.0 * k, 11.4 * k], final: 11.4 * k }, D.tempos || {});
      const st = document.getElementById('stage');
      const claro = ['gradiente', 'italico-serifa'].includes(M.estilo_acento);
      const fotoFundo = D.fundo ? caminho(D.fundo) : null;
      if (claro && !fotoFundo && !S.transparente) st.classList.add('claro');
      if (fotoFundo || S.transparente) st.classList.add('sobre-foto');

      // ---- fundo
      const f = U.el('div', 'fundo', st);
      if (S.transparente) { f.style.display = 'none'; st.style.background = 'transparent'; }
      else if (fotoFundo) { refs.img = U.el('img', '', f); refs.img.src = fotoFundo; U.el('div', 'grade', f); }
      else {
        f.classList.add('marca');
        const lg = U.el('img', 'logo-gigante', f); lg.src = caminho(M.logo); refs.logoG = lg;
      }
      U.el('div', 'grao', st);

      // ---- gancho
      refs.gancho = U.el('div', 'gancho', st);
      refs.pals = palavras(refs.gancho, D.gancho || `Você sabe chegar\nno *${M.local.nome_curto}*?`);

      // ---- pin
      const px = (D.pin && D.pin.x) || 540, py = (D.pin && D.pin.y) || 930;
      refs.px = px; refs.py = py;
      refs.ondas = [0, 1, 2].map(i => {
        const o = U.el('div', 'onda', st);
        const cor = M.cores.anel ? M.cores.anel[(i * 3) % M.cores.anel.length] : (i % 2 ? M.cores.destaque : M.cores.primaria);
        return U.css(o, { left: px + 'px', top: py + 'px', borderColor: cor });
      });
      refs.sombra = U.css(U.el('div', 'sombra', st), { left: px + 'px', top: py + 'px' });
      refs.pin = U.css(U.el('div', 'pin', st), { left: px + 'px', top: py + 'px' });
      const corPin = M.slug === 'arteiro' ? '#111' : M.cores.primaria;
      const gradAnel = M.cores.anel ? `<defs><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1">${M.cores.anel.map((c, i) => `<stop offset="${i / (M.cores.anel.length - 1)}" stop-color="${c}"/>`).join('')}</linearGradient></defs>` : '';
      refs.pin.innerHTML = `<svg class="gota" viewBox="0 0 190 250">${gradAnel}<path d="M95 246 C 70 196, 6 150, 6 92 A 89 89 0 1 1 184 92 C 184 150, 120 196, 95 246 Z" fill="${corPin}" ${M.cores.anel ? 'stroke="url(#ga)" stroke-width="10"' : ''}/></svg><div class="cabeca"><img src="${caminho(M.logo)}"></div>`;

      // ---- rótulo
      refs.rot = U.el('div', 'rotulo', st);
      U.el('div', 'nm', refs.rot, M.local.nome_curto);
      const cid = (M.local.cidade || '').split('·')[0].trim();
      const bairro = (M.local.bairro || '').includes(cid) ? M.local.bairro : [M.local.bairro, cid].filter(Boolean).join(' · ');
      U.el('div', 'bx', refs.rot, icone('pin') + bairro);
      // posiciona ao lado do pin; se não couber na zona segura (x 60..1000), vai centralizado acima do pin
      await document.fonts.ready;
      const rw = refs.rot.offsetWidth, rh = refs.rot.offsetHeight;
      let ladoDir = px < 540, rx = ladoDir ? px + 70 : px - 70 - rw, ry = py - 330;
      if (rx < 60 || rx + rw > 1000) { rx = U.clamp(px - rw / 2, 60, 1000 - rw); ry = py - 250 - rh - 40; refs.rotAcima = true; }
      U.css(refs.rot, { left: rx + 'px', top: ry + 'px' });
      refs.rotLadoDir = ladoDir;

      // ---- fatos
      const fatos = (D.fatos || M.fatos || []).slice(0, 4);
      refs.fatosBox = U.el('div', 'fatos', st);
      refs.fatosTit = U.el('div', 'tit', refs.fatosBox, D.titulo_fatos || 'Chegando lá');
      refs.chips = fatos.map((ft, i) => {
        const c = U.el('div', 'chip', refs.fatosBox);
        const b = U.el('div', 'bola', c, icone(ft.icone));
        if (M.cores.anel) b.style.background = M.cores.anel[(i * 2 + 1) % M.cores.anel.length];
        U.el('span', '', c, ft.texto);
        return c;
      });

      // ---- lower-third
      if (D.rosto_em && M.rosto && M.rosto.nome) {
        refs.lt = U.el('div', 'lt', st, `<span class="n">${M.rosto.nome}</span><span class="c">${M.rosto.cargo}</span>`);
      }

      // ---- cartão final
      const fi = U.el('div', 'final', st); refs.final = fi;
      refs.veu = U.el('div', 'veu', fi);
      const selo = U.el('div', 'selo', fi); refs.selo = selo;
      const cores = M.cores.anel || [M.cores.primaria, M.cores.destaque];
      selo.innerHTML = `<svg viewBox="0 0 330 330"><g class="giro">${anel(cores, 160, 26)}</g></svg><img src="${caminho(M.logo)}">`;
      refs.giro = selo.querySelector('.giro');
      refs.fNm = U.el('div', 'nm', fi, M.nome_completo || M.nome);
      const l = M.local;
      const linhaEnd = (l.endereco && l.endereco_confirmado) ? l.endereco : (l.unidade ? `${l.unidade} · ${l.bairro}` : l.bairro);
      refs.fEnd = U.el('div', 'end', fi, icone('pin') + linhaEnd);
      refs.fCid = U.el('div', 'cid', fi, l.cidade || '');
      refs.fCta = U.el('div', 'cta', fi, D.cta || M.cta_padrao);
      refs.fAr = (M.instagram && !M.instagram_confirmar) ? U.el('div', 'arroba', fi, M.instagram) : null;
      refs.finalItens = [selo, refs.fNm, refs.fEnd, refs.fCid, refs.fCta, refs.fAr].filter(Boolean);

      legendas = montarLegendas(st, D.legendas);
      if (new URLSearchParams(location.search).has('guias')) U.el('div', 'guias', st);
      await carregarImagens([fotoFundo, caminho(M.logo)]);
    },

    desenhar(t) {
      // fundo: Ken Burns lento puxando para o pin
      if (refs.img) {
        const k = U.p(t, 0, dur);
        const s = 1.04 + 0.12 * U.eInOut(k);
        const ox = (refs.px - 540) * 0.08 * k, oy = (refs.py - 960) * 0.08 * k;
        refs.img.style.transform = `translate(${-ox}px, ${-oy}px) scale(${s})`;
      }
      if (refs.logoG) refs.logoG.style.transform = `rotate(${t * 2.2}deg) scale(${1 + t * 0.006})`;

      // gancho: palavras sobem em sequência, saem juntas para cima
      const [g0, g1] = T.gancho;
      refs.pals.forEach((w, i) => {
        const a = U.p(t, g0 + i * 0.075, g0 + i * 0.075 + 0.42);
        const sai = U.eIn(U.p(t, g1 - 0.35, g1));
        w.style.opacity = U.eOut(a) * (1 - sai);
        w.style.transform = `translateY(${(1 - U.eBack(a)) * 70 - sai * 90}px)`;
      });

      // pin: cai com mola e assenta
      const pk = U.p(t, T.pin, T.pin + 0.7);
      const queda = 1 - U.mola(pk, 2.4, 5.5);
      const fimP = 1 - U.eIn(U.p(t, T.final - 0.3, T.final));
      const amass = t > T.pin + 0.33 && t < T.pin + 0.6 ? 1 - 0.12 * Math.sin(U.p(t, T.pin + 0.33, T.pin + 0.6) * Math.PI) : 1;
      refs.pin.style.opacity = (pk > 0 ? 1 : 0) * fimP;
      refs.pin.style.transform = `translateY(${-760 * queda}px) scale(${(2 - amass) * .5 + .5}, ${amass})`;
      const flut = Math.sin((t - T.pin) * 2.2) * 6 * U.p(t, T.pin + 1, T.pin + 1.6);
      if (t > T.pin + 1) refs.pin.style.transform += ` translateY(${flut}px)`;
      refs.sombra.style.opacity = U.eOut(pk) * .9 * fimP;
      refs.sombra.style.transform = `scale(${0.4 + 0.6 * U.eOut(pk)})`;
      refs.ondas.forEach((o, i) => {
        const ok = U.p(t, T.pin + 0.32 + i * 0.22, T.pin + 1.5 + i * 0.22);
        const d = 40 + 560 * U.eOut(ok);
        o.style.width = o.style.height = d + 'px';
        o.style.opacity = ok > 0 && ok < 1 ? (1 - ok) * .9 * fimP : 0;
      });

      // rótulo abre ao lado do pin
      const rk = U.eOut(U.p(t, T.rotulo, T.rotulo + 0.55));
      refs.rot.style.opacity = U.p(t, T.rotulo, T.rotulo + 0.2) * fimP;
      refs.rot.style.clipPath = refs.rotAcima ? `inset(${100 - rk * 100}% 0 0 0 round 26px)` : refs.rotLadoDir ? `inset(0 ${100 - rk * 100}% 0 0 round 26px)` : `inset(0 0 0 ${100 - rk * 100}% round 26px)`;
      refs.rot.style.transform = `translateY(${(1 - rk) * 20}px)`;

      // fatos: título + chips deslizando da esquerda
      const [f0, f1] = T.fatos;
      refs.fatosTit.style.opacity = U.janela(t, f0, f1, .3, .3);
      refs.fatosTit.style.transform = `translateX(${(1 - U.eOut(U.p(t, f0, f0 + .4))) * -40}px)`;
      refs.chips.forEach((c, i) => {
        const a = U.p(t, f0 + 0.25 + i * 0.42, f0 + 0.25 + i * 0.42 + 0.5);
        const sai = U.eIn(U.p(t, f1 - 0.35 + i * 0.04, f1 + i * 0.04));
        c.style.opacity = U.eOut(a) * (1 - sai);
        c.style.transform = `translateX(${(1 - U.eBack(a)) * -260 + sai * 120}px)`;
      });

      // lower-third
      if (refs.lt) {
        const [l0, l1] = D.rosto_em;
        const lk = U.janela(t, l0, l1, .4, .3);
        refs.lt.style.opacity = lk; refs.lt.style.transform = `translateX(${(1 - lk) * -60}px)`;
      }

      // cartão final
      const fk = U.p(t, T.final, T.final + 0.5);
      refs.final.style.display = fk > 0 ? 'flex' : 'none';
      refs.veu.style.opacity = U.eOut(fk) * (refs.img || S.transparente ? .9 : 1);
      refs.finalItens.forEach((e, i) => {
        const a = U.p(t, T.final + 0.15 + i * 0.12, T.final + 0.15 + i * 0.12 + 0.5);
        e.style.opacity = U.eOut(a);
        e.style.transform = `translateY(${(1 - U.eBack(a)) * 50}px)` + (e === refs.selo ? ` scale(${0.7 + 0.3 * U.eBack(a)})` : '');
      });
      if (refs.giro) refs.giro.setAttribute('transform', `rotate(${(t - T.final) * 24} 165 165)`);

      legendas(t);
      // desvio: durante os fatos, legenda vai pro topo e lower-third sobe acima do bloco (não colide com os chips)
      const emFatos = t >= T.fatos[0] - 0.1 && t < T.fatos[1] + 0.2;
      if (!refs.leg) refs.leg = document.querySelector('.legenda');
      if (refs.leg) refs.leg.style.top = emFatos ? '250px' : '1330px';
      if (refs.lt) refs.lt.style.top = emFatos ? (refs.fatosBox.offsetTop - refs.lt.offsetHeight - 30) + 'px' : '1180px';
    },
  };
})();
</script>
</body>
</html>
